<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.site_title }}{% endblock %}</title>
<meta name="description" content="{% block desc %}{{ cfg.site_tagline }}{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ depth }}static/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="{{ depth }}index.html"><span class="brand-mark">IPO</span>{{ cfg.site_title }}</a>
    <nav>
      <a href="{{ depth }}index.html">IPO 列表</a>
      <a href="{{ depth }}about.html">方法与来源</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block body %}{% endblock %}
</main>
<footer class="foot">
  <div class="wrap">
    <p>本站内容仅供学习参考，<strong>不构成任何投资建议</strong>。数据可能有误或延迟，请以 Bursa Malaysia 公告及招股书为准。</p>
    <p class="muted">资料更新：{{ built }} · 每个数字旁的 <sup class="ref">[1]</sup> 可点进原始来源</p>
  </div>
</footer>
<script src="{{ depth }}static/app.js"></script>
</body>
</html>
