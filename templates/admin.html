{% extends "base.html" %}
{% block title %}后台 · {{ cfg.site_title }}{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<section class="auth-box admin-box">
  <h1>后台：上传招股书</h1>
  <p class="muted" data-admin-msg>检查登入中…</p>
  <form id="upload-form" class="form" hidden>
    <label for="pdf">招股书 PDF（最大 50MB）</label>
    <input id="pdf" type="file" accept="application/pdf" required>
    <label for="bursa-url">Bursa 招股书链接（选填，方便读者核对）</label>
    <input id="bursa-url" type="url" placeholder="https://www.bursamalaysia.com/...">
    <label for="slug">对应哪家公司（选填）</label>
    <select id="slug"><option value="">新公司 / 让程序自己判断</option>
      {% for r in records %}<option value="{{ r.slug }}">{{ r.name_zh or r.name }}</option>{% endfor %}
    </select>
    <button class="btn" type="submit">上传</button>
    <p class="fn">上传后通常 1 小时内处理完：程序读招股书、核对每个数字的原文和页码、更新资料和 9 宫格，再重新发布网站。</p>
  </form>
  <p class="fn" data-upload-msg></p>
  <div id="upload-list" hidden>
    <h2>最近上传</h2>
    <table class="tbl"><thead><tr><th>文件</th><th>上传时间</th><th>状态</th></tr></thead><tbody></tbody></table>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ depth }}static/admin.js"></script>{% endblock %}
